spring:
  application:
    name: DEV - SpringBootTodoApi
  datasource:
    url: jdbc:postgresql://localhost:5432/localDatabase
    username: localUser
    password: localPassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.task.springboottodoapi.utils: debug

